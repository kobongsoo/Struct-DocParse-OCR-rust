[package]
name = "sdp-core"
version.workspace = true
edition.workspace = true
description = "구조화 문서 파서 + OCR 본체 (SimpleRAG docmodel · ocr 에서 옮김)"

[lib]
name = "sdp_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
once_cell = "1"
# OCR — onnxruntime.dll 을 실행 시점에 적재(SimpleRAG 와 같은 버전으로 묶는다)
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
flate2 = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cfb = "0.10"
calamine = { version = "0.30", features = ["dates"] }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
tiff = "0.11"
html-escape = "0.2"
